name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release at the end is created with GITHUB_TOKEN, which needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the bundled Basic Pitch model
        run: |
          echo "2c3c1d144bfa61ad236e92e169c13535c880469a12a047d4e73451f2c059a0ec  app/src/main/assets/models/nmp.onnx" | sha256sum -c -

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pianosheet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Every push to main publishes the release the app looks for: the in-app
      # updater reads /releases/latest and installs the APK attached here.
      - name: Publish the GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" && test -n "$version_code"
          tag="v${version_name}"
          apk="pianosheet-${version_name}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          previous_tag="$(git tag --list 'v*' --sort=-creatordate | grep -v -x "$tag" | head -n 1 || true)"
          if test -n "$previous_tag"; then
            changes="$(git log --pretty='- %s' "${previous_tag}..HEAD" | head -n 12)"
          else
            changes="$(git log --pretty='- %s' -n 5)"
          fi
          notes="$(mktemp)"
          {
            echo 'アプリ内の「設定 → アプリ」から、または起動時の案内から1タップで更新できます（初回は「この提供元のアプリを許可」が必要）。'
            echo ''
            echo '主な変更点:'
            echo "${changes}"
            echo ''
            echo "versionCode: ${version_code}"
          } > "$notes"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id 2>/dev/null || true)"
          case "$release_id" in '' | *[!0-9]*) release_id='' ;; esac
          if test -z "$release_id"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_REF_NAME" -f name="PianoSheet ${version_name}" -f body="$(cat "$notes")" -F draft=false -F prerelease=false -f make_latest=true > /dev/null
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f name="PianoSheet ${version_name}" -f body="$(cat "$notes")" -f make_latest=true > /dev/null
            for asset_id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq ".[] | select(.name == \"${apk}\") | .id"); do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > /dev/null
            done
          fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"${apk}" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${apk}" > /dev/null
          echo "published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
